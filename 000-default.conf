# Hide Apache version
ServerTokens Prod
ServerSignature Off

# HTTP - Redirigir a HTTPS
<VirtualHost *:80>
    ServerName cytcomunicaciones.com
    ServerAlias www.cytcomunicaciones.com
    Redirect permanent / https://cytcomunicaciones.com/
</VirtualHost>

# HTTPS
<VirtualHost *:443>
    ServerName cytcomunicaciones.com
    ServerAlias www.cytcomunicaciones.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/app/cms/public

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cytcomunicaciones.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cytcomunicaciones.com/privkey.pem

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    <Directory /var/www/html/app/cms/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
